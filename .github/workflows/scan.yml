name: Scan internships & deadlines

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:
    inputs:
      test_notify:
        description: "Only send a test notification to your phone"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      - name: Test notification
        if: ${{ inputs.test_notify }}
        run: python scanner/scan.py --test-notify
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TRACKER_GIST_ID: ${{ secrets.TRACKER_GIST_ID }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Scan
        if: ${{ !inputs.test_notify }}
        run: python scanner/scan.py
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          TRACKER_GIST_ID: ${{ secrets.TRACKER_GIST_ID }}
          APP_URL: ${{ vars.APP_URL }}

      - name: Save results
        if: ${{ !inputs.test_notify }}
        run: |
          git config user.name "apply-hub-bot"
          git config user.email "apply-hub-bot@users.noreply.github.com"
          git add docs/data data/state.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "scan: $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash
          git push
