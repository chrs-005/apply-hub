<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="ui.css">
  <style>body { width: 340px; padding: 14px; }</style>
</head>
<body>
  <div class="row between"><b style="font-size:16px">⚡ Apply Hub</b><a href="options.html" target="_blank" class="small">Profile & settings</a></div>
  <label class="tiny muted" style="display:block;margin-top:12px">This application is for</label>
  <select id="mode">
    <option value="auto">Auto-detect</option>
    <option value="internship">Internship (graduating Jun 2028)</option>
    <option value="grad">Grad school (graduating Jun 2027)</option>
  </select>
  <button id="fill" class="btn primary block" style="margin-top:8px">Autofill this page</button>
  <p class="tiny muted" style="margin:6px 0 0">Shortcut: Alt+Shift+F · fills, never submits</p>
  <p id="result" class="small"></p>
  <hr>
  <b class="small">Log this application</b>
  <input id="company" placeholder="Company / university">
  <input id="role" placeholder="Role / program">
  <div class="row">
    <select id="status"><option>Applied</option><option>Saved</option><option>Preparing</option><option>Test / OA</option><option>Interview</option></select>
    <button id="track" class="btn">Add to tracker</button>
  </div>
  <p id="track-result" class="tiny muted"></p>
  <hr>
  <b class="small">Floating ⚡ Autofill button</b>
  <label class="tiny" style="display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="fabAll" style="width:auto;margin:0"> Show it (master switch)</label>
  <label class="tiny" style="display:flex;gap:6px;align-items:center;margin-top:4px"><input type="checkbox" id="fabSite" style="width:auto;margin:0"> Show it on <span id="fabHost">this site</span></label>
  <hr>
  <b class="small">Quick copy</b>
  <div id="copy" class="chips"></div>
  <script src="popup.js"></script>
</body>
</html>
