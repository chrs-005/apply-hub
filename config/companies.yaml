# Companies the scanner checks every run.
#
#   ats:   which job-board API the company uses (greenhouse, lever, ashby, workable,
#          workday, janestreet, google, microsoft, amazon)
#   token: the company's id on that board (the part of the URL, e.g. boards.greenhouse.io/<token>)
#   type:  quant | bigtech | ai | tech   (used for filtering + "typical opening" hints)
#   tier:  1 = dream, 2 = strong, 3 = nice to have   (used for sorting)
#   opens: when Summer internships usually open (shown in the app while nothing is posted yet)
#
# To add a company: find its careers page, click a job, look at the URL:
#   boards.greenhouse.io/XXX or job-boards.greenhouse.io/XXX -> ats: greenhouse, token: XXX
#   jobs.lever.co/XXX                                        -> ats: lever,      token: XXX
#   jobs.ashbyhq.com/XXX                                     -> ats: ashby,      token: XXX
#   apply.workable.com/XXX                                   -> ats: workable,   token: XXX
# then run `python scanner/scan.py --check` to confirm it works.

defaults:
  opens:
    quant: "Jul – Oct (rolling: apply in the first 2–3 weeks)"
    bigtech: "Aug – Nov"
    ai: "Sep – Jan (many roles are PhD-only)"
    tech: "Oct – Mar"

