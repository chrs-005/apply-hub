# Locations to drop when they are the ONLY location (US etc.).
# Just here for clarity: anything that does not match a region above is dropped anyway.

# Push notifications (ntfy). The topic itself is a secret: set it as the
# NTFY_TOPIC secret on GitHub (or env var locally), not here.
notify:
  server: https://ntfy.sh
  # If more than this many new internships are found in one run, send one summary instead.
  max_individual: 6
  # Daily digest hour (UTC). 6 = 9am Beirut.
  digest_hour_utc: 6
  # Remind about deadlines this many days ahead.
  deadline_warn_days: [14, 7, 3, 1]

# Public URL of your app (GitHub Pages). Used for "open in app" links in notifications.
app_url: ""

# Rough FX rates to compare costs in USD (update occasionally).
fx_to_usd: {USD: 1.0, EUR: 1.16, GBP: 1.34, CHF: 1.25, AED: 0.272, SAR: 0.267, QAR: 0.275}
