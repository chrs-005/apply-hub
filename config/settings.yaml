# What counts as a relevant internship for you. Edit freely.

# A job title must match one of these to count as an internship.
internship_patterns:
  - '\bintern(s|ship|ships)?\b'
  - '\bsummer (analyst|associate|student|program|programme|researcher|engineer|trader)\b'
  - '\bstagiaire\b'
  - '\bstage\b'
  - '\bpraktik(um|ant|antin)\b'
  - '\bwerkstudent'
  - '\bworking student\b'
  - '\b(industrial )?placement\b'
  - '\boff[- ]cycle\b'
  - '\bstudent researcher\b'
  - '\bco-?op\b'

# Interest categories: a job is kept if its title matches at least one.
# (For quant firms, generic titles like "Summer Internship 2027" are also kept.)
categories:
  swe:      '\b(software|developer|swe|sde|engineer(ing)?|backend|back-end|frontend|full[- ]?stack|systems?|infrastructure|platform|devops|sre|compiler|kernel|embedded|fpga|hardware|security|developpeur|entwickler)\b'
  quant:    '\b(quant(itative)?|trad(er|ing)|market making|strategist|algorithmic|algo|portfolio|risk)\b'
  ml:       '\b(machine learning|ml|ai|artificial intelligence|deep learning|llm|nlp|computer vision|data scien(ce|tist)|applied scien(ce|tist)|reinforcement|generative|modell?ing)\b'
  research: '\b(research(er)?|scientist|phd|mathematic(s|ian)|theor(y|etical)|recherche)\b'
  data:     '\b(data engineer(ing)?|analytics engineer|data platform|data infrastructure)\b'

# Titles matching this are dropped even if they match a category.
exclude: '\b(mba|legal|lawyer|marketing|sales|account (manager|executive)|recruit(ing|er)|talent|human resources|hr|people (team|partner)|communications|pr|content|social media|customer|support|warehouse|whs|logistics|fulfil+ment|operations associate|tax|audit|accounting|payroll|procurement|facilities|executive assistant|office|graphic|ux writer|copywriter|nurse|pharmac|apprentice(ship)?|technician|data cent(er|re)|maintenance|field|medical|seo|consult(ing|ant)|business develop(er|ment)|finance & strategy|data quality|operations engineering|physical|solutions? engineer|account tech)\b'

# Titles mentioning these years are treated as old postings and dropped.
stale_years: ['2024', '2025', '2026 summer', 'summer 2026']

