  - id: x-msct
    target: suggested
    short: Polytechnique
    why: "You uploaded its checklist. Round 1 has passed; Round 2 (11 Jan) is the last with scholarships."
    requires:
      letters: 2
      letters_note: "At least 1 academic; the 2nd may be an internship/job manager"
      gre: {status: "no", note: "Not requested."}
      english: {status: "letter-or-test", note: "TOEFL 95 / IELTS 7.0 / C1, or waived with official proof that your last degree was taught entirely in English."}
