# Master's programs for Fall 2027 entry.
# Researched 2026-10-05. `source` says how solid each number is:
#   official   = read on the university's own page
#   aggregator = from a reliable 3rd-party listing, matches the usual pattern
#   estimate   = last cycle's value or typical figure: VERIFY before relying on it
# `verify` lists the fields you should double-check on the program page.
#
# Money: amount + currency. The app converts to USD (rates in config/settings.yaml)
# so you can sort by cost. tuition_per: year | semester | total.
#
# Tip: you can edit this file from your phone directly on github.com.
# The app updates on the next scan.

programs:
# ======================= YOUR APPLICATIONS =======================
# target: core      = on your board by default
# target: suggested = offered under "Worth adding" in the app
# requires: what each one needs (the app builds the checklist and comparison table from it).
# Checked on official pages 2026-11-01 unless `verify` lists the field. Oxford and Columbia's
# requirement pages block automated reading, so those fields are marked verify.

  - id: eth-cs
    target: core
    university: ETH Zurich
    short: ETH
    program: MSc Computer Science
    country: Switzerland
    region: CH
    fields: [cs, ml]
    opens: 2026-11-01
    deadlines:
      - {label: "Only window for non-Swiss bachelor's (includes ESOP)", date: 2026-11-30, time: "11:59 in the MORNING, CET"}
    app_fee: {amount: 150, currency: CHF, note: "No fee waivers"}
    tuition: {amount: 2190, currency: CHF, per: semester}
    scholarships:
      - {name: "ESOP (Excellence & Opportunity)", deadline: 2026-11-30, covers: "CHF 13,500/semester + tuition waiver (about 60 awards)", how: "Same window. Needs a master's thesis pre-proposal on top of the normal documents, and you should be top 10% of your cohort. Possible interview in February; decisions by end of March."}
    language: "C1 proof by the deadline: TOEFL/IELTS/C1 Advanced, or a stamped Registrar letter that your bachelor's was COMPLETELY taught in English"
    gre: "Not asked for in anything I could read (ETH says only 'like GRE, if required')"
    requires:
      letters: 2
      letters_note: "In English, strongly prefer academics"
      gre: {status: "no", note: "Not stated as required; third-party sources say it isn't considered. Confirm in eApply."}
      english: {status: "by-deadline", note: "Must be in by the deadline or the application is rejected and can't be fixed. A Registrar letter works only if ALL your bachelor's teaching was in English; a wrong one means direct rejection."}
      statement: "Motivation letter, about 1 A4 page"
      extras: ["ESOP only: master's thesis pre-proposal", "Check the Computer Science subject prerequisites PDF and minimum-grade page"]
    url: https://ethz.ch/en/studies/master/application/master-informatik.html
    source: official
    verify: [app_fee]
    notes: "120 ECTS, 2 years. Majors: Machine Intelligence, Theoretical Computer Science, Data Management Systems, Secure and Reliable Systems, Visual and Interactive Computing. You can apply to two ETH programs (CHF 150 each, one motivation letter per program). Your likely gap: Formal Methods & Functional Programming. Late or incomplete applications are not processed."

