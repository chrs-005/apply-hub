# Researched 2026-10-05. `source` says how solid each number is:
#   official   = read on the university's own page
#   aggregator = from a reliable 3rd-party listing, matches the usual pattern
#   estimate   = last cycle's value or typical figure: VERIFY before relying on it
# `verify` lists the fields you should double-check on the program page.
#
# Money: amount + currency. The app converts to USD (rates in config/settings.yaml)
# so you can sort by cost. tuition_per: year | semester | total.
#
# Tip: you can edit this file from your phone directly on github.com.
# The app updates on the next scan.

